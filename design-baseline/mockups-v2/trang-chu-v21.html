<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trang chủ v2.1</title>
<meta name="description" content="Bản thử trang chủ v2.1 (BA 09/10/2026): Chức năng thường dùng dạng lưới nhiều hàng, Tổng quan có thanh trạng thái và biểu đồ giá trị, Bảng tin công ty.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Token: giữ màu nhận diện của DESIGN.md v0.24; phần mới của v2 là nền trang ngả màu, thẻ bo 20 px không viền có bóng nhẹ. */
:root {
  --bg: #EEF2F7; --bg-glow: #DCE7F5;
  --surface: #FFFFFF; --surface-muted: #F4F6F9; --surface-sunken: #E9EDF2;
  --border: #E6E8EB; --border-strong: #80858E;
  --text: #111418; --text-muted: #4B4F55; --text-subtle: #6B7078;
  --primary: #0752A4; --primary-hover: #064283; --on-primary: #FFFFFF;
  --primary-container: #DCE9F8; --on-primary-container: #063A73;
  --success: #166534; --success-container: #DCFCE7;
  --warning: #854D0E; --warning-container: #FEF3C7;
  --danger: #B91C1C; --danger-container: #FEE2E2;
  --bar-soft: #BBD3F1; --bar-strong: #0752A4; --bar-attn: #B91C1C; --series-2: #D9731A;
  --track: #F1F4F8; --hatch: #D3DCE7; --grid: #E9EDF2;
  --mod-fueling: #C2410C; --mod-inventory: #2563EB; --mod-quality: #15803D; --mod-sales: #7C3AED;
  --mod-purchasing: #0E7490; --mod-maintenance: #B45309; --mod-finance: #A16207; --mod-hr: #BE185D;
  --mod-reports: #4F46E5; --mod-masterdata: #0369A1; --mod-system: #475569;
  --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 6px 20px rgba(16, 24, 40, .05);
  --radius-card: 20px; --radius-tile: 18px;
  color-scheme: light;
}
:root[data-theme="hc"] {
  --bg: #FFFFFF; --bg-glow: #FFFFFF;
  --surface: #FFFFFF; --surface-muted: #F1F5F9; --surface-sunken: #E2E8F0;
  --border: #0F172A; --border-strong: #000000;
  --text: #000000; --text-muted: #1E293B; --text-subtle: #334155;
  --primary: #053B78; --primary-hover: #03274F; --on-primary: #FFFFFF;
  --primary-container: #DCE9F8; --on-primary-container: #053B78;
  --success: #14532D; --warning: #713F12; --danger: #7F1D1D;
  --bar-soft: #9DBDE6; --bar-strong: #053B78; --bar-attn: #991B1B; --hatch: #94A3B8; --grid: #CBD5E1;
  --shadow: 0 0 0 1px #0F172A;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-theme="hc"]) {
    --bg: #0B1220; --bg-glow: #12223D;
    --surface: #111A2C; --surface-muted: #16213A; --surface-sunken: #1E2A45;
    --border: #2C3A57; --border-strong: #8492AB;
    --text: #E5EAF3; --text-muted: #A9B6CC; --text-subtle: #7C8BA5;
    --primary: #7FB0EE; --primary-hover: #A6C9F4; --on-primary: #04172E;
    --primary-container: #12386B; --on-primary-container: #D3E4FA;
    --success: #86EFAC; --success-container: #0F3D22;
    --warning: #FCD34D; --warning-container: #3D2E08;
    --danger: #FCA5A5; --danger-container: #4A1414;
    --bar-soft: #2B4C7A; --bar-strong: #5E97E0; --bar-attn: #E5484D; --series-2: #D9782A;
    --track: #15203A; --hatch: #26345284; --grid: #1E2A45;
    --mod-fueling: #FB923C; --mod-inventory: #60A5FA; --mod-quality: #4ADE80; --mod-sales: #A78BFA;
    --mod-purchasing: #22D3EE; --mod-maintenance: #F59E0B; --mod-finance: #FACC15; --mod-hr: #F472B6;
    --mod-reports: #818CF8; --mod-masterdata: #38BDF8; --mod-system: #94A3B8;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1220; --bg-glow: #12223D;
  --surface: #111A2C; --surface-muted: #16213A; --surface-sunken: #1E2A45;
  --border: #2C3A57; --border-strong: #8492AB;
  --text: #E5EAF3; --text-muted: #A9B6CC; --text-subtle: #7C8BA5;
  --primary: #7FB0EE; --primary-hover: #A6C9F4; --on-primary: #04172E;
  --primary-container: #12386B; --on-primary-container: #D3E4FA;
  --success: #86EFAC; --success-container: #0F3D22;
  --warning: #FCD34D; --warning-container: #3D2E08;
  --danger: #FCA5A5; --danger-container: #4A1414;
  --bar-soft: #2B4C7A; --bar-strong: #5E97E0; --bar-attn: #E5484D; --series-2: #D9782A;
  --track: #15203A; --hatch: #263452; --grid: #1E2A45;
  --mod-fueling: #FB923C; --mod-inventory: #60A5FA; --mod-quality: #4ADE80; --mod-sales: #A78BFA;
  --mod-purchasing: #22D3EE; --mod-maintenance: #F59E0B; --mod-finance: #FACC15; --mod-hr: #F472B6;
  --mod-reports: #818CF8; --mod-masterdata: #38BDF8; --mod-system: #94A3B8;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: Inter, 'Segoe UI', Roboto, Arial, sans-serif; font-size: 14px; line-height: 1.45;
  color: var(--text); -webkit-font-smoothing: antialiased;
  background: radial-gradient(1100px 520px at 80% -8%, var(--bg-glow), transparent 65%), var(--bg);
  background-attachment: fixed; min-height: 100dvh;
}
button { font: inherit; color: inherit; }
a { color: inherit; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-feature-settings: "tnum" 1, "zero" 1; }

/* Thanh điều khiển của bản thử, không thuộc giao diện thật */
.proto-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 16px; font-size: 12px;
  background: var(--surface); border-bottom: 1px dashed var(--border-strong); color: var(--text-muted); }
.proto-bar strong { color: var(--text); }
.proto-bar .grp { display: inline-flex; align-items: center; gap: 6px; }
.proto-bar .grp > span { white-space: nowrap; }
.pseg { display: inline-flex; background: var(--surface-muted); border-radius: 999px; padding: 2px; }
.pseg button { border: 0; background: none; padding: 4px 10px; border-radius: 999px; cursor: pointer; font-size: 12px; white-space: nowrap; }
.pseg button[aria-pressed="true"] { background: var(--surface); box-shadow: var(--shadow); color: var(--text); font-weight: 600; }

/* Khung */
.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); }
.sidebar { position: sticky; top: 12px; height: calc(100dvh - 24px); margin: 12px 0 12px 12px; background: var(--surface);
  border-radius: var(--radius-card); box-shadow: var(--shadow); display: flex; flex-direction: column; padding: 16px 12px; overflow: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 16px; }
.brand-mark { width: 36px; height: 36px; border-radius: 12px; background: #0752A4; display: grid; place-items: center; flex: none; }
.brand-mark span { width: 14px; height: 14px; border-radius: 4px; background: #F4EB28; transform: rotate(45deg); }
.brand b { font-size: 16px; }
.brand small { display: block; color: var(--text-subtle); font-size: 12px; }
.nav-label { margin: 14px 10px 6px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--text-subtle); }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; text-decoration: none; color: var(--text-muted); font-weight: 500; }
.nav a:hover { background: var(--surface-muted); }
.nav a[aria-current="page"] { background: var(--primary-container); color: var(--on-primary-container); font-weight: 600; }
.nav a.dim { color: var(--text-subtle); }
.nav a .count { margin-left: auto; font-size: 11px; font-weight: 600; background: var(--danger-container); color: var(--danger); border-radius: 999px; padding: 1px 7px; }
.nav .txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.main { min-width: 0; padding: 12px 20px 32px; }
.topbar { display: flex; align-items: center; gap: 10px; min-height: 52px; }
.search { flex: 1; min-width: 0; max-width: 420px; white-space: nowrap; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 999px;
  background: var(--surface); box-shadow: var(--shadow); color: var(--text-subtle); }
.search .ph { overflow: hidden; text-overflow: ellipsis; }
.search kbd { margin-left: auto; font: 500 11px Inter, sans-serif; border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; }
.topbar .spacer { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 999px; background: var(--surface);
  box-shadow: var(--shadow); border: 0; cursor: pointer; white-space: nowrap; font-weight: 500; }
.pill .muted { color: var(--text-subtle); font-weight: 400; }
.tools { display: inline-flex; align-items: center; gap: 4px; padding: 4px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); }
.icon-btn { position: relative; display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 999px; border: 0;
  background: var(--surface-muted); cursor: pointer; color: var(--text-muted); flex: none; }
.icon-btn:hover { background: var(--surface-sunken); color: var(--text); }
.icon-btn .dot { position: absolute; top: 7px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 0 2px var(--surface-muted); }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 13px;
  background: var(--primary); color: var(--on-primary); flex: none; }

/* Hàng 1: lời chào + KPI */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "greet kpis" "favs favs"; gap: 16px 24px; align-items: end; margin: 16px 0; }
.greet { grid-area: greet; min-width: 0; }
.kpis { grid-area: kpis; }
.favs-row { grid-area: favs; display: flex; align-items: center; gap: 8px; min-width: 0; }
.favs-row .icon-btn { background: var(--surface); box-shadow: var(--shadow); width: 40px; height: 40px; }
.greet h1 { margin: 0; font-size: 32px; line-height: 1.15; font-weight: 700; letter-spacing: -.01em; }
.greet h1 .name { overflow-wrap: anywhere; }
.greet .sub { margin: 6px 0 0; color: var(--text-muted); }
.favs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 4px; margin: -4px; min-width: 0; flex: 1; }
.favs::-webkit-scrollbar { display: none; }
.favs.more { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 48px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 48px), transparent); }
.fav { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 6px; border-radius: 999px; border: 0; cursor: pointer;
  background: var(--surface); box-shadow: var(--shadow); white-space: nowrap; font-weight: 500; flex: none; }
.fav:hover { background: var(--surface-muted); }
.fav .ico { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--tint);
  background: color-mix(in srgb, var(--tint) 14%, var(--surface)); }
.fav .ico svg { width: 15px; height: 15px; }
.fav.ghost { background: transparent; box-shadow: inset 0 0 0 1px var(--border); color: var(--text-muted); padding: 0 14px; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(150px, 176px)); gap: 12px; }
.kpi { display: flex; flex-direction: column; justify-content: space-between; gap: 14px; min-height: 108px; padding: 14px 16px; border-radius: var(--radius-tile);
  background: var(--surface); box-shadow: var(--shadow); text-decoration: none; border: 1px solid transparent; cursor: pointer; text-align: left; transition: border-color .15s; }
.kpi:hover { border-color: var(--primary-container); }
.kpi-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.kpi-label { font-size: 13px; font-weight: 500; color: var(--text-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.kpi-ico { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: none; color: var(--tint); background: color-mix(in srgb, var(--tint) 14%, var(--surface)); }
.kpi-ico svg { width: 16px; height: 16px; }
.kpi.is-danger .kpi-ico { color: var(--danger); background: var(--danger-container); }
.kpi.is-warning .kpi-ico { color: var(--warning); background: var(--warning-container); }
.kpi-bottom { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.kpi-value { font-size: 26px; font-weight: 600; line-height: 1; white-space: nowrap; }
.kpi-value small { font-size: 13px; font-weight: 500; color: var(--text-subtle); margin-left: 3px; }
.kpi-link { font-size: 12px; color: var(--text-subtle); white-space: nowrap; }
.kpi:hover .kpi-link { color: var(--primary); }

/* Hàng 2 */
.row2 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(330px, 1fr); gap: 16px; }
.card { background: var(--surface); border-radius: var(--radius-card); box-shadow: var(--shadow); padding: 20px; min-width: 0; }
.card h2 { margin: 0; font-size: 18px; font-weight: 600; }
.chart-card, .tasks-card { height: 440px; display: flex; flex-direction: column; }

.cc-head { display: flex; align-items: center; gap: 12px; }
.cc-head h2 { white-space: nowrap; }
.mod-pills { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 1; padding: 2px; }
.mod-pills::-webkit-scrollbar { display: none; }
.mod-pill { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; border: 0; cursor: pointer;
  background: var(--surface-muted); color: var(--text-muted); white-space: nowrap; font-weight: 500; flex: none; }
.mod-pill svg { width: 15px; height: 15px; color: var(--tint); }
.mod-pill[aria-pressed="true"] { background: var(--primary-container); color: var(--on-primary-container); font-weight: 600; }
.mod-single { color: var(--text-muted); font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.mod-single svg { width: 15px; height: 15px; color: var(--tint); }
.cc-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; flex: none; }
.delta { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 10px; border-radius: 999px; background: var(--surface-muted);
  color: var(--text-muted); font-size: 13px; white-space: nowrap; }
.delta b { color: var(--text); font-weight: 600; }
.delta svg { width: 14px; height: 14px; }
.cc-sub { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 14px 0 6px; }
.cc-cap { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.cc-caption { margin: 0; color: var(--text-muted); font-size: 13px; min-width: 0; }
.seg { display: inline-flex; background: var(--surface-muted); border-radius: 999px; padding: 3px; flex: none; }
.seg button { border: 0; background: none; height: 28px; padding: 0 12px; border-radius: 999px; cursor: pointer; color: var(--text-muted); font-weight: 500; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); font-weight: 600; }
.seg .short { display: none; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; min-height: 18px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; }
.cc-body { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* Cột theo nhóm (Hôm nay): vệt gạch chéo là phần còn trống của thang (với Kho là sức chứa) */
.cols { flex: 1; display: flex; gap: 12px; align-items: stretch; min-height: 0; padding-top: 6px; }
.col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; border: 0; background: none; padding: 0; cursor: pointer; text-align: center; }
.col-track { position: relative; flex: 1; min-height: 120px; border-radius: 16px; overflow: hidden;
  background: repeating-linear-gradient(135deg, var(--hatch) 0 1px, transparent 1px 7px), var(--track); }
.col-fill { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 16px; background: var(--bar-soft); transition: height .35s ease, background .15s; }
.col:hover .col-fill, .col:focus-visible .col-fill { background: var(--bar-strong); }
.col.is-attn .col-fill { background: var(--bar-attn); }
.col-val { position: absolute; left: 50%; transform: translateX(-50%); font-weight: 600; font-size: 13px; padding: 2px 8px; border-radius: 999px;
  background: var(--surface); color: var(--text); white-space: nowrap; box-shadow: 0 0 0 1px var(--border); }
.col-name { font-size: 13px; font-weight: 500; color: var(--text-muted); display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-width: 0; }
.col-name .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.col-name svg { width: 14px; height: 14px; color: var(--danger); }
.col.is-attn .col-name { color: var(--text); font-weight: 600; }
.col-sub { font-size: 11px; color: var(--text-subtle); margin-top: -6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Cột theo thời gian (7N, 30N, 12T) */
.tscroll { flex: 1; min-height: 0; overflow: hidden; display: flex; }
.tchart { flex: 1; display: grid; grid-template-columns: 40px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) 22px; min-width: 0; padding-top: 12px; }
.yaxis { position: relative; grid-row: 1; }
.yaxis span { position: absolute; right: 8px; transform: translateY(50%); font-size: 11px; color: var(--text-subtle); }
.plot { position: relative; margin-right: 14px; grid-row: 1 / span 2; grid-column: 2; display: grid; grid-template-rows: minmax(0, 1fr) 22px; }
.gridlines { position: absolute; inset: 0 0 22px 0; pointer-events: none; }
.gridlines i { position: absolute; left: 0; right: 0; height: 1px; background: var(--grid); }
.gridlines i.base { background: var(--border); }
.tbars { grid-row: 1 / span 2; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); position: relative; }
.tg { border: 0; background: none; padding: 0; cursor: pointer; display: grid; grid-template-rows: minmax(0, 1fr) 22px; min-width: 0; border-radius: 8px; }
.tg:hover, .tg:focus-visible { background: color-mix(in srgb, var(--surface-sunken) 55%, transparent); }
.tg-bars { position: relative; display: flex; align-items: flex-end; justify-content: center; gap: 2px; padding: 0 2px; }
.tg-bar { width: min(24px, 64%); border-radius: 4px 4px 0 0; background: var(--bar-soft); min-height: 1px; transition: height .35s ease; }
.tg.two .tg-bar { width: min(12px, 40%); }
.tg.is-now .tg-bar { background: var(--bar-strong); }
.tg .tg-bar.s1 { background: var(--bar-strong); }
.tg .tg-bar.s2 { background: var(--series-2); }
.tg-lab { font-size: 11px; color: var(--text-subtle); line-height: 22px; white-space: nowrap; }
.tg.is-now .tg-lab { color: var(--text); font-weight: 600; }
.tg-val { position: absolute; left: 50%; transform: translateX(-50%); font-size: 12px; font-weight: 600; white-space: nowrap; }

.tip { position: absolute; z-index: 5; pointer-events: none; background: var(--text); color: var(--surface); padding: 8px 10px; border-radius: 10px;
  font-size: 12px; line-height: 1.5; white-space: nowrap; transform: translate(-50%, calc(-100% - 8px)); opacity: 0; transition: opacity .1s; }
.tip.on { opacity: 1; }
.tip b { font-weight: 600; }
.tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }

.dtable { width: 100%; border-collapse: collapse; font-size: 13px; }
.dtable th { text-align: left; font-weight: 600; color: var(--text-muted); background: var(--surface-muted); padding: 8px 10px; position: sticky; top: 0; }
.dtable td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
.dtable td.r, .dtable th.r { text-align: right; }
.tablewrap { flex: 1; overflow: auto; min-height: 0; border-radius: 12px; }

/* Việc cần làm */
.tk-head { display: flex; align-items: center; gap: 8px; }
.tk-head .count { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface-muted); color: var(--text-muted); }
.tk-head .icon-btn { margin-left: auto; width: 32px; height: 32px; }
.tk-filter { margin: 12px 0 10px; }
.tasks { list-style: none; margin: 0 -4px; padding: 0 4px 4px; display: grid; gap: 8px; align-content: start; overflow-y: auto; flex: 1; min-height: 0; }
.task { display: grid; grid-template-columns: 40px minmax(0, 1fr) 32px; align-items: center; gap: 12px; padding: 10px 10px 10px 12px; border-radius: 16px;
  border: 1px solid var(--border); background: var(--surface); cursor: pointer; }
.task:hover { background: var(--surface-muted); }
.task.is-hot { background: color-mix(in srgb, var(--primary-container) 60%, var(--surface)); border-color: transparent; }
.ring { position: relative; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--c);
  background: conic-gradient(var(--c) calc(var(--p) * 1%), var(--surface-sunken) 0); }
.ring::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--surface); }
.task.is-hot .ring::before { background: color-mix(in srgb, var(--primary-container) 60%, var(--surface)); }
.ring svg { position: relative; width: 16px; height: 16px; }
.t-title { margin: 0; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.t-meta { margin: 2px 0 0; font-size: 12px; color: var(--text-subtle); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.badge { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; }
.badge svg { width: 11px; height: 11px; }
.badge.danger { background: var(--danger-container); color: var(--danger); }
.badge.warning { background: var(--warning-container); color: var(--warning); }
.badge.info { background: var(--surface-muted); color: var(--text-muted); }
.go { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; border: 0; background: transparent; color: var(--text-muted); cursor: pointer; }
.task.is-hot .go { background: var(--primary); color: var(--on-primary); }
.go svg { width: 16px; height: 16px; }

/* Trạng thái */
.state { flex: 1; display: grid; place-items: center; align-content: center; gap: 8px; text-align: center; color: var(--text-muted); padding: 16px; }
.state .big { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-muted); color: var(--text-subtle); }
.state.err .big { background: var(--danger-container); color: var(--danger); }
.state p { margin: 0; max-width: 300px; }
.state strong { color: var(--text); }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border-strong);
  background: var(--surface); cursor: pointer; font-weight: 500; }
.sk { background: linear-gradient(90deg, var(--surface-muted), var(--surface-sunken), var(--surface-muted)); background-size: 200% 100%;
  animation: sk 1.2s linear infinite; border-radius: 10px; }
@keyframes sk { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .sk { animation: none; } .col-fill, .tg-bar { transition: none; } }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 50;
  background: var(--text); color: var(--surface); padding: 10px 16px; border-radius: 12px; font-size: 13px; max-width: calc(100vw - 32px); transition: .2s; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

.bottom-nav { display: none; }
.menu { position: fixed; z-index: 40; min-width: 220px; padding: 6px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); box-shadow: 0 16px 40px rgba(16, 24, 40, .16); display: none; }
.menu.on { display: block; }
.menu .mh { padding: 6px 10px; font-size: 12px; font-weight: 600; color: var(--text-subtle); }
.mi { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 8px; border: 0; background: none; text-align: left; cursor: pointer; }
.mi svg { width: 16px; height: 16px; color: var(--text-subtle); }
.mi:hover, .mi:focus { background: var(--surface-muted); outline: none; }
.mi .k { margin-left: auto; font-size: 12px; color: var(--text-subtle); }
.mi[aria-checked="true"], .mi[aria-checked="true"] svg { color: var(--primary); font-weight: 600; }

/* Màn rộng vừa: KPI xuống dưới lời chào */
@media (max-width: 1320px) {
  .hero { grid-template-columns: minmax(0, 1fr); grid-template-areas: "greet" "favs" "kpis"; }
  .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (max-width: 1120px) {
  .row2 { grid-template-columns: minmax(0, 1fr); }
  .tasks-card { height: auto; max-height: 560px; }
}
/* Máy tính bảng: sidebar chỉ icon */
@media (max-width: 1023px) {
  .app { grid-template-columns: 76px minmax(0, 1fr); }
  .sidebar { padding: 14px 10px; }
  .brand { justify-content: center; padding: 2px 0 12px; }
  .brand div, .nav-label, .nav .txt, .nav .count { display: none; }
  .nav a { justify-content: center; padding: 10px; }
  .search kbd, .pill .muted { display: none; }
}
/* Điện thoại */
@media (max-width: 767px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { display: none; }
  .main { padding: 8px 16px 96px; }
  .topbar { gap: 8px; }
  .search { display: none; }
  .topbar .m-brand { display: flex !important; }
  .pill { height: 36px; padding: 0 12px; }
  .pill.shift { display: none; }
  .tools { padding: 3px; }
  .tools .icon-btn.mail { display: none; }
  .hero { margin: 8px 0 16px; gap: 14px; }
  .greet h1 { display: block; font-size: 28px; }
  .greet h1 .hello { display: block; font-size: 13px; font-weight: 500; color: var(--text-muted); line-height: 1.3; }
  .greet h1 .name { color: var(--primary); }
  .greet .sub { font-size: 13px; margin: 4px 0 0; }
  .favs { margin: -4px 0 -4px -16px; padding: 4px 16px; }
  .hero { grid-template-areas: "greet" "kpis" "favs"; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .kpi { min-height: 96px; padding: 12px 14px; }
  .kpi-value { font-size: 22px; }
  .card { padding: 16px; border-radius: 18px; }
  .chart-card { height: auto; }
  .cc-head { flex-wrap: wrap; }
  .cc-head .mod-pills { order: 3; flex-basis: 100%; margin: 0 -16px; padding: 2px 16px; }
  .cc-sub { flex-wrap: wrap; }
  .seg .long { display: none; }
  .seg .short { display: inline; }
  .cc-body { height: 280px; flex: none; }
  .cols { gap: 8px; }
  .col-name { font-size: 11px; line-height: 1.25; align-items: flex-start; min-height: 28px; }
  .col-name .t { white-space: normal; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .col-name svg { width: 12px; height: 12px; margin-top: 1px; }
  .col-val { font-size: 12px; padding: 1px 6px; }
  .tscroll { overflow-x: auto; }
  .tchart.wide { min-width: 640px; }
  .tasks-card { max-height: none; }
  .tasks { overflow: visible; }
  .delta .vs { display: none; }
  .bottom-nav { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--surface); box-shadow: 0 -4px 20px rgba(16, 24, 40, .08); border-radius: 20px 20px 0 0;
    padding: 8px 8px max(8px, env(safe-area-inset-bottom)); }
  .bottom-nav a { display: grid; justify-items: center; gap: 2px; font-size: 11px; text-decoration: none; color: var(--text-subtle); padding: 4px 0; position: relative; }
  .bottom-nav a[aria-current="page"] { color: var(--primary); font-weight: 600; }
  .bottom-nav .count { position: absolute; top: 0; left: calc(50% + 6px); font-size: 10px; font-weight: 600; background: var(--danger); color: #fff; border-radius: 999px; padding: 0 5px; }
  .toast { bottom: 92px; }
}
.m-brand { display: none !important; align-items: center; gap: 8px; }
.m-brand .brand-mark { width: 32px; height: 32px; border-radius: 10px; }
.m-brand .brand-mark span { width: 12px; height: 12px; }

/* ================= v2.1 (BA 09/10/2026) ================= */
/* Bảng màu biểu đồ trạng thái (tươi, đọc được trên nền Sáng và Tối). */
:root { --st-gray: #94A3B8; --st-amber: #F5A524; --st-blue: #3B82F6; --st-green: #22A55B; --st-orange: #F97316; --st-red: #E5484D; }
.greet { display: flex; align-items: flex-end; gap: 12px; }
.greet > div { min-width: 0; flex: 1; }
.greet .icon-btn { background: var(--surface); box-shadow: var(--shadow); width: 40px; height: 40px; flex: none; }
.hero { grid-template-areas: "greet kpis"; }
@media (max-width: 1100px) { .hero { grid-template-areas: "greet" "kpis"; } }

/* Chức năng thường dùng: thẻ có tiêu đề, lưới ô biểu tượng nhiều hàng (tối đa 16). */
.favs-card { margin-bottom: 16px; }
.fc-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.fc-head .count { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface-muted); color: var(--text-muted); }
.fc-head .btn { margin-left: auto; height: 32px; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
.ftile { display: grid; justify-items: center; align-content: start; gap: 8px; min-height: 104px; padding: 14px 8px 12px; border: 0; border-radius: 16px; background: none; color: var(--text); cursor: pointer; text-align: center; font: inherit; }
.ftile:hover { background: var(--surface-muted); }
.ftile:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.ftile .ico { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; color: var(--tint); background: color-mix(in srgb, var(--tint) 13%, var(--surface)); }
.ftile .ico svg { width: 22px; height: 22px; }
.ftile .nm { font-size: 13px; font-weight: 500; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ftile.add .ico { color: var(--text-muted); background: none; box-shadow: inset 0 0 0 1.5px var(--border-strong); border-radius: 14px; }
.ftile.add .nm { color: var(--text-muted); }
@media (max-width: 767px) {
  .fgrid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
  .ftile { min-height: 92px; padding: 10px 2px; }
  .ftile .nm { font-size: 12px; }
}

/* Thanh trạng thái: một thanh ngang chia màu, mũi tên chỉ vào từng màu kèm chú thích (BA 09/10/2026: tổng luôn 100% nên không vẽ cột). */
.sbar-wrap { position: relative; margin: 6px 0 4px; }
.sbar-top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.sbar-top b { font-size: 22px; font-weight: 700; }
.sbar-top span { color: var(--text-muted); font-size: 13px; }
.sbar { display: flex; height: 22px; border-radius: 999px; overflow: hidden; gap: 2px; background: var(--surface); }
.sseg { height: 100%; border: 0; padding: 0; background: var(--c); cursor: pointer; min-width: 6px; transition: filter .15s, transform .15s; }
.sseg:hover, .sseg:focus-visible, .sseg.hl { filter: brightness(1.08) saturate(1.15); outline: none; transform: scaleY(1.18); }
.sseg:first-child { border-radius: 999px 0 0 999px; }
.sseg:last-child { border-radius: 0 999px 999px 0; }
.slinks { position: absolute; left: 0; width: 100%; pointer-events: none; overflow: visible; }
.slinks path { fill: none; stroke: var(--c); stroke-width: 1.5; }
.slinks polygon { fill: var(--c); }
.scall { display: grid; gap: 10px; margin-top: 34px; }
.scall-item { border: 0; background: var(--surface-muted); border-radius: 14px; padding: 10px 12px; text-align: left; cursor: pointer; color: var(--text); font: inherit; border-top: 3px solid var(--c); min-width: 0; }
.scall-item:hover, .scall-item.hl { background: color-mix(in srgb, var(--c) 10%, var(--surface)); }
.scall-item:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.scall-item .h { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--text-muted); }
.scall-item .h svg { width: 13px; height: 13px; color: var(--danger); }
.scall-item .v { display: flex; align-items: baseline; gap: 6px; margin-top: 2px; }
.scall-item .v b { font-size: 20px; font-weight: 700; }
.scall-item .v span { font-size: 12px; color: var(--text-muted); }
.scall-item .d { margin: 4px 0 0; font-size: 12px; color: var(--text-muted); line-height: 1.35; }
.vsep { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin: 22px 0 12px; }
.vsep h3 { margin: 0; font-size: 14px; font-weight: 600; white-space: nowrap; }
.vsep p { margin: 0; font-size: 12px; color: var(--text-muted); flex: 1 1 240px; }
.vsep .lg { margin-left: auto; display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--text-muted); }
.vsep .lg i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
@media (max-width: 767px) {
  .slinks { display: none; }
  .scall { grid-template-columns: minmax(0, 1fr) !important; margin-top: 12px; gap: 6px; }
  .scall-item { border-top: 0; border-left: 4px solid var(--c); display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 8px; }
  .scall-item .v { grid-row: 1 / span 2; grid-column: 2; margin: 0; }
  .vsep { flex-wrap: wrap; }
  .vsep .lg { margin-left: 0; width: 100%; }
}

/* Tổng quan dạng thanh trạng thái + biểu đồ giá trị: khung cao theo nội dung (không còn 440 px cố định). */
.chart-card.is-status { height: auto; }
.chart-card.is-status .cc-body { height: auto !important; flex: none; display: block; }
.row2:has(.chart-card.is-status) .tasks-card { height: auto; max-height: none; }
.row2:has(.chart-card.is-status) .tasks { max-height: 640px; }
/* Tiến độ theo giờ ETA: cột kế hoạch (nhạt), phần đã tra nạp (đậm), phần trễ (đỏ), vạch Bây giờ. */
.hrs { position: relative; margin-top: 26px; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); align-items: end; gap: 6px; height: 170px; padding: 0 0 22px; border-bottom: 1px solid var(--grid); }
.hr { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; border: 0; background: none; padding: 0; cursor: pointer; font: inherit; color: inherit; }
.hr .stack { position: relative; width: 100%; max-width: 28px; display: flex; flex-direction: column-reverse; border-radius: 6px 6px 3px 3px; overflow: hidden; background: var(--bar-soft); }
.hr .stack i { display: block; width: 100%; }
.hr .stack .done { background: var(--st-green); }
.hr .stack .late { background: var(--st-red); }
.hr .stack .base { background: var(--bar-strong); }
.hr .lab { position: absolute; bottom: -20px; font-size: 11px; color: var(--text-muted); }
.hr .num-top { font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 3px; }
.hr.future .stack { background: color-mix(in srgb, var(--bar-soft) 70%, var(--surface)); box-shadow: inset 0 0 0 1px var(--bar-soft); }
.hr.is-late .num-top { color: var(--st-red); }
.hr:hover .stack, .hr:focus-visible .stack { filter: brightness(.95); }
.hr:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 6px; }
.nowline { position: absolute; top: -6px; bottom: 22px; width: 0; border-left: 2px dashed var(--primary); pointer-events: none; }
.nowline span { position: absolute; top: -20px; left: -26px; width: 52px; text-align: center; font-size: 11px; font-weight: 700; color: var(--primary); }
.hr .avgdot { position: absolute; left: 50%; width: 10px; height: 3px; margin-left: -5px; border-radius: 2px; background: var(--text); opacity: .55; }
.hr.anom .stack .base { background: var(--st-orange); }

/* Tuổi Hold: mỗi đối tượng một thanh, vạch ngưỡng. */
.holds { display: grid; gap: 10px; position: relative; }
.hold { display: grid; grid-template-columns: minmax(120px, 200px) minmax(0, 1fr) 64px; align-items: center; gap: 12px; border: 0; background: none; padding: 4px 0; text-align: left; cursor: pointer; color: inherit; font: inherit; }
.hold .who b { display: block; font-size: 13px; }
.hold .who small { display: block; font-size: 11px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hold .track { position: relative; height: 14px; border-radius: 999px; background: var(--track); }
.hold .fill { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--st-amber); }
.hold.over .fill { background: var(--st-red); }
.hold .age { font-size: 13px; font-weight: 700; text-align: right; }
.hold.over .age { color: var(--st-red); }
.hold:hover .track, .hold:focus-visible .track { box-shadow: 0 0 0 2px var(--primary-container); }
.thr { position: absolute; top: -8px; bottom: -4px; width: 0; border-left: 2px dashed var(--danger); opacity: .7; pointer-events: none; }
.thr span { position: absolute; top: -16px; left: 4px; font-size: 11px; font-weight: 600; color: var(--danger); white-space: nowrap; }
@media (max-width: 767px) { .hold { grid-template-columns: minmax(0, 1fr) 56px; } .hold .track { grid-column: 1 / -1; grid-row: 2; } }

/* Bảng tin công ty */
.news-card { margin-top: 16px; }
.nw-head { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.nw-head .count { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--primary-container); color: var(--on-primary-container); }
.nw-head .sp { margin-left: auto; }
.nw-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; }
.feat { display: grid; grid-template-rows: auto 1fr; border: 0; padding: 0; background: none; text-align: left; cursor: pointer; color: inherit; font: inherit; border-radius: 18px; }
.feat:focus-visible, .nitem:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
.cover { position: relative; aspect-ratio: 16 / 7.5; border-radius: 18px; overflow: hidden; background: var(--cv-bg); display: grid; place-items: center; }
.cover svg.art { position: absolute; inset: 0; width: 100%; height: 100%; }
.cover .pin { position: absolute; top: 12px; left: 12px; display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; background: rgba(255, 255, 255, .92); color: #111418; font-size: 12px; font-weight: 600; }
.cover .pin svg { width: 13px; height: 13px; }
.feat .body { padding: 14px 4px 4px; }
.ncat { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--cat); }
.ncat::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--cat); }
.feat h3 { margin: 6px 0 6px; font-size: 20px; line-height: 1.3; font-weight: 700; letter-spacing: -.01em; }
.feat p { margin: 0; color: var(--text-muted); font-size: 14px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.nmeta { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--text-muted); }
.newdot { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; background: var(--primary); color: var(--on-primary); font-size: 11px; font-weight: 700; }
.nlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; align-content: start; }
.nitem { width: 100%; display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; align-items: center; padding: 8px; border: 0; border-radius: 14px; background: none; text-align: left; cursor: pointer; color: inherit; font: inherit; }
.nitem:hover { background: var(--surface-muted); }
.nitem .cover { aspect-ratio: 4 / 3; border-radius: 12px; }
.nitem h4 { margin: 3px 0 2px; font-size: 14px; font-weight: 600; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.nitem .nmeta { margin-top: 2px; }
.nitem.unread h4::after { content: ""; display: inline-block; width: 8px; height: 8px; margin-left: 6px; border-radius: 50%; background: var(--primary); vertical-align: 1px; }
@media (max-width: 900px) { .nw-grid { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 767px) { .feat h3 { font-size: 17px; } .nitem { grid-template-columns: 76px minmax(0, 1fr); } }

/* Trang con của bản thử: Đọc tin, Tất cả tin, Quản lý tin, Soạn tin. */
.view { display: none; }
body.in-view main > section { display: none; }
body.in-view .view { display: block; }
.vback { display: inline-flex; align-items: center; gap: 6px; margin: 4px 0 14px; border: 0; background: none; color: var(--primary); font: inherit; font-weight: 600; cursor: pointer; padding: 4px 0; }
.vback svg { width: 16px; height: 16px; transform: rotate(180deg); }
.article { max-width: 820px; margin: 0 auto; }
.article .cover { aspect-ratio: 16 / 6.5; }
.article h1 { margin: 16px 0 8px; font-size: 28px; line-height: 1.25; letter-spacing: -.02em; }
.article .ameta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--text-muted); margin-bottom: 18px; }
.article .content { font-size: 15px; line-height: 1.7; }
.article .content h3 { font-size: 17px; margin: 22px 0 6px; }

  m.classList.add('on'); b.setAttribute('aria-expanded', 'true');
  const r = b.getBoundingClientRect();
  m.style.top = r.bottom + 6 + 'px'; m.style.left = Math.max(8, Math.min(r.right - m.offsetWidth, innerWidth - m.offsetWidth - 8)) + 'px';
  m.querySelector('[aria-checked="true"]')?.focus();
}

function niceMax(v) {
  if (v <= 0) return 1;
  const p = 10 ** Math.floor(Math.log10(v));
  for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p;
  return 10 * p;
}

function trendData(mod) {
  const n = S.range === '7d' ? 7 : S.range === '30d' ? 30 : 12;
  const unit = S.range === '12m' ? 'm' : 'd';
  const seedBase = { dispatch: 11, inventory: 23, qc: 37, sales: 41, admin: 53, mine: 67 }[S.mod] * 100 + n;
  return mod.trend.series.map((s, i) => ({ ...s, ...series(seedBase + i * 7, n, unit, (r, d) => (unit === 'm' ? s.month(r, d) : s.day(r, d))) }));
}
function labelOf(d, i, n) {
  if (S.range === '12m') return 'T' + (d.getMonth() + 1);
  if (S.range === '7d') return WD[d.getDay()];
  return (i % 5 === 4 || i === n - 1) ? dd(d) : '';
}
function fullLabel(d) {
  if (S.range === '12m') return `Tháng ${d.getMonth() + 1}/${d.getFullYear()}`;
  return `${WD[d.getDay()]}, ${dd(d)}/${d.getFullYear()}`;
}
const PREV = { today: 'hôm qua', '7d': '7 ngày trước', '30d': '30 ngày trước', '12m': '12 tháng trước' };

function setDelta(cur, prev) {
  const el = $('delta');
  if (S.state !== 'normal' || !MODS[S.mod] || !prev) { el.style.display = 'none'; return; }
  el.style.display = '';
  const d = (cur - prev) / prev * 100;
  el.innerHTML = `${ic(d >= 0 ? 'up' : 'dn')}<b class="num">${d >= 0 ? '+' : '−'}${pct.format(Math.abs(d))}%</b><span class="vs">so với ${PREV[S.range]}</span>`;
}

function stateBox(kind) {

  if (kind === 'error') return `<div class="state err" role="alert"><span class="big">${ic('alert')}</span><p><strong>Không tải được số liệu.</strong><br>Số liệu khác trên trang vẫn dùng được.</p><button class="btn" data-retry>${ic('refresh')}Thử lại</button></div>`;
  if (kind === 'empty') return `<div class="state"><span class="big">${ic('chart')}</span><p><strong>Chưa có số liệu cho kỳ này.</strong><br>Khi có chứng từ trong phạm vi của bạn, biểu đồ sẽ hiện ở đây.</p></div>`;
  return `<div class="state"><span class="big">${ic('lock')}</span><p><strong>Bạn chưa được giao phân hệ nào có biểu đồ.</strong><br>Liên hệ quản trị viên để được cấp quyền xem.</p></div>`;
}

function renderChart() {
  const mod = MODS[S.mod];
  const body = $('chart');
  const legend = $('legend');
  legend.innerHTML = '';
  document.querySelectorAll('#ranges button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.r === S.range));
  $('tbl-btn').setAttribute('aria-pressed', S.table);
  if (!mod) { $('cc-caption').textContent = ''; setDelta(0, 0); body.innerHTML = stateBox('none'); return; }
  const today = S.range === 'today';
  $('cc-caption').textContent = today ? mod.today.caption : mod.trend.caption;
  if (S.state !== 'normal') { setDelta(0, 0); body.innerHTML = stateBox(S.state); return; }

  document.querySelector('.chart-card').classList.toggle('is-status', today && !!STATUS[S.mod] && S.state === 'normal');
  if (today && STATUS[S.mod]) { renderStatusToday(S.mod, mod, body); return; }
  if (today) {
    const t = mod.today;
    const total = t.bars.reduce((a, b) => a + b.v, 0);

function bindTip(el, html, anchor) {
  const show = () => {
    const tip = $('tip'); if (!tip) return;
    const host = $('chart').getBoundingClientRect();
    const a = anchor().getBoundingClientRect();
    const bars = [...el.querySelectorAll('.col-fill, .tg-bar')].map((x) => x.getBoundingClientRect().top);
    const top = Math.min(...bars, a.bottom);
    tip.innerHTML = html;
    const half = tip.offsetWidth / 2;
    const x = Math.min(Math.max(a.left + a.width / 2 - host.left, half), host.width - half);
    tip.style.left = x + 'px';
    tip.style.top = Math.max(top - host.top, tip.offsetHeight + 8) + 'px';
    tip.classList.add('on');
  };
  const hide = () => $('tip')?.classList.remove('on');
  el.addEventListener('pointerenter', show); el.addEventListener('focus', show);
  el.addEventListener('pointerleave', hide); el.addEventListener('blur', hide);
}

function renderTasks() {
  const role = ROLES[S.role];
  const all = role.tasks;
  const counts = { all: all.length, urgent: all.filter((t) => t.st === 'urgent').length, overdue: all.filter((t) => t.st === 'overdue').length };
  $('tk-count').textContent = S.state === 'normal' ? all.length : '';
  $('tk-filter').innerHTML = [['all', 'Tất cả'], ['urgent', 'Khẩn'], ['overdue', 'Quá hạn']].map(([k, n]) =>
    `<button data-f="${k}" aria-pressed="${S.filter === k}">${n}${S.state === 'normal' ? ` <span class="num">${counts[k]}</span>` : ''}</button>`).join('');
  const el = $('tasks');
  if (S.state === 'loading') { el.innerHTML = Array.from({ length: 4 }, () => `<li class="task" aria-hidden="true"><span class="sk" style="width:40px;height:40px;border-radius:50%"></span><span><span class="sk" style="display:block;height:13px;width:80%"></span><span class="sk" style="display:block;height:10px;width:50%;margin-top:6px"></span></span><span></span></li>`).join(''); return; }
  if (S.state === 'error') { el.innerHTML = `<li class="state err" role="alert"><span class="big">${ic('alert')}</span><p><strong>Không tải được việc cần làm.</strong></p><button class="btn" data-retry>${ic('refresh')}Thử lại</button></li>`; return; }
  const list = S.state === 'empty' ? [] : all.filter((t) => S.filter === 'all' || t.st === S.filter);
  if (list.length === 0) { el.innerHTML = `<li class="state"><span class="big">${ic('done')}</span><p><strong>Không còn việc nào${S.filter === 'all' ? '' : ' ở mục này'}.</strong><br>Việc mới được giao sẽ hiện ở đây.</p></li>`; return; }
  const hot = list.findIndex((t) => t.st);
  el.innerHTML = list.map((t, i) => {
    const c = t.st === 'overdue' ? 'var(--danger)' : t.st === 'urgent' ? 'var(--warning)' : 'var(--primary)';
    const badge = t.st === 'overdue' ? `<span class="badge danger">${ic('clock')}Quá hạn</span>` : t.st === 'urgent' ? `<span class="badge warning">${ic('alert')}Khẩn</span>` : '';
    return `<li class="task ${i === hot ? 'is-hot' : ''}" tabindex="0" data-toast="Mở ${t.kind}: ${esc(t.t)}.">
      <span class="ring" style="--c:${c};--p:${t.p}" aria-hidden="true">${ic(t.icon)}</span>
      <div><p class="t-title">${esc(t.t)}</p><p class="t-meta">${t.kind} · ${t.due} ${badge}</p></div>
      <button class="go" aria-label="Mở việc">${ic('right')}</button></li>`;
  }).join('');
}

function renderAll() {
  const role = ROLES[S.role];
  if (!role.mods.includes(S.mod)) {
    const saved = store.get('tapetco.home.mod.' + S.role);
    S.mod = role.mods.includes(saved) ? saved : role.mods[0] ?? null;
  }
  document.querySelectorAll('.pseg').forEach((g) => g.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', S[g.dataset.ctl] === b.dataset.v)));
  renderNav(); renderHero(); renderMods(); renderKpis(); renderChart(); renderTasks(); renderNews();
}

document.addEventListener('click', (e) => {
  const c = e.target.closest('.pseg button');
  if (c) {
    const k = c.closest('.pseg').dataset.ctl; S[k] = c.dataset.v;
    if (k === 'theme') applyTheme();
    if (k === 'role') S.filter = 'all';
    renderAll(); return;
  }
  const m = e.target.closest('[data-mod]');
  if (m) { S.mod = m.dataset.mod; store.set('tapetco.home.mod.' + S.role, S.mod); renderMods(); renderKpis(); renderChart(); return; }
  const r = e.target.closest('#ranges button');
  if (r) { S.range = r.dataset.r; renderChart(); return; }
  const f = e.target.closest('#tk-filter button');
  if (f) { S.filter = f.dataset.f; renderTasks(); return; }
  if (e.target.closest('[data-retry]')) { S.state = 'normal'; renderAll(); return; }
  if (e.target.closest('#theme-btn')) { themeMenu(!$('menu').classList.contains('on')); return; }
  const tv = e.target.closest('[data-theme-v]');
  if (tv) { S.theme = tv.dataset.themeV; applyTheme(); themeMenu(false); $('theme-btn').focus(); renderAll(); return; }
  if (!e.target.closest('#menu')) themeMenu(false);
  if (e.target.closest('#tbl-btn')) { S.table = !S.table; renderChart(); return; }
  if (e.target.closest('#open-src')) { const mod = MODS[S.mod]; if (mod) toast(`Mở «${S.range === 'today' ? mod.today.list : mod.trend.list}» với bộ lọc của biểu đồ.`); return; }
  const t = e.target.closest('[data-toast]');
  if (t) { e.preventDefault(); toast(t.dataset.toast); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && $('menu').classList.contains('on')) { themeMenu(false); $('theme-btn').focus(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.task')) { e.preventDefault(); toast(e.target.dataset.toast); }
});

}

function renderStatusToday(key, mod, body) {
  const st = STATUS[key];

  }
  body.innerHTML = `<div class="sbar-wrap">

      <div class="sbar" role="list" aria-label="Tỉ lệ theo ${st.field.toLowerCase()}">${st.items.map((x, i) => `<button class="sseg" role="listitem" data-s="${i}" style="--c:var(${x.c});flex:${x.v}" aria-label="${x.k}: ${x.v} (${pct.format(x.v / total * 100)}%). ${x.d} Bấm để mở danh sách."></button>`).join('')}</div>

      <div class="scall" style="grid-template-columns:repeat(${st.items.length}, minmax(0, 1fr))">${st.items.map((x, i) => `<button class="scall-item" data-s="${i}" style="--c:var(${x.c})">

        <p class="d">${x.d}</p></button>`).join('')}</div>
    </div>

  });

  body.querySelectorAll('.hold').forEach((el) => { el.onclick = () => toast(`Mở «Release và Hold» của ${el.dataset.hold}.`); });
  drawLinks();
}

/* Mũi tên: từ chú thích đi lên, gãy khúc, mũi nhọn chỉ vào giữa đoạn màu. */
function drawLinks() {
  const svg = $('slinks'); if (!svg) return;
  const wrap = svg.parentElement, bar = wrap.querySelector('.sbar');
  const wb = wrap.getBoundingClientRect(), bb = bar.getBoundingClientRect();
  const segs = [...bar.children], calls = [...wrap.querySelectorAll('.scall-item')];
  const top = bb.bottom - wb.top, bottom = calls[0].getBoundingClientRect().top - wb.top;
  svg.style.top = `${top}px`; svg.setAttribute('height', bottom - top); svg.setAttribute('width', wb.width);
  const mid = (bottom - top) / 2;
  svg.innerHTML = segs.map((s, i) => {
    const sr = s.getBoundingClientRect(), cr = calls[i].getBoundingClientRect();
    const x1 = sr.left + sr.width / 2 - wb.left, x2 = cr.left + Math.min(24, cr.width / 2) - wb.left, h = bottom - top;
    const c = s.style.getPropertyValue('--c');
    return `<g style="--c:${c}"><path d="M${x2},${h} V${mid + 2 + i * 0} H${x1} V7"/><polygon points="${x1 - 4},8 ${x1 + 4},8 ${x1},2"/></g>`;
  }).join('');
}
